spring:
  data:
    redis:
      # Enable cluster mode and specify node endpoints
      cluster:
        nodes:
          - localhost:7001
          - localhost:7002
          - localhost:7003
          - localhost:7004
          - localhost:7005
          - localhost:7006
        # Max redirects when keys move during failover/resharding
        max-redirects: 3

      # Connection timeouts
      connect-timeout: 3000ms
      timeout: 3000ms