###############################################################################
# VALKEY PRODUCTION HARDENING CONFIGURATION
###############################################################################

# -----------------------------------------------------------------------------
# NETWORK & BOUNDARY ISOLATION
# -----------------------------------------------------------------------------
# Bind ONLY to specific loopback or private network interfaces (never 0.0.0.0)
bind 127.0.0.1 192.168.86.210

# Enforce protected mode to prevent unauthenticated access if network rules fail
protected-mode yes

# -----------------------------------------------------------------------------
# TRANSPORT & ENCRYPTION (TLS / mTLS)
# -----------------------------------------------------------------------------
# Disable unencrypted plain TCP communication completely
port 0

# Enable TLS port for all client and node communication
tls-port 6379

# TLS Certificate Configurations
tls-cert-file /Users/Projects/solutions/cloudNativeData/showCase/dev/valkey-showcase/runtime/etc/valkey/valkey-certs/valkey.crt
tls-key-file /Users/Projects/solutions/cloudNativeData/showCase/dev/valkey-showcase/runtime/etc/valkey/valkey-certs/valkey.key
tls-ca-cert-file /Users/Projects/solutions/cloudNativeData/showCase/dev/valkey-showcase/runtime/etc/valkey/valkey-certs/ca.crt

# Enforce Mutual TLS (mTLS) - Clients MUST present a valid certificate
tls-auth-clients yes

# -----------------------------------------------------------------------------
# CLUSTER & REPLICATION ENCRYPTION
# -----------------------------------------------------------------------------
# Encrypt node-to-node Cluster Bus (Gossip protocol) and Replication traffic
tls-cluster yes
tls-replication yes

# -----------------------------------------------------------------------------
# AUTHENTICATION & ACCESS CONTROL
# -----------------------------------------------------------------------------
# Externalize ACL definitions to a dedicated, read-only file
aclfile /Users/Projects/solutions/cloudNativeData/showCase/dev/valkey-showcase/scripts/devOps/security/users.acl

# Credentials used by Replicas/Cluster Nodes to authenticate to the Primary
masteruser cluster_internal_admin
masterauth "StrongInternalPassphrase123!"

# -----------------------------------------------------------------------------
# RUNTIME & RESOURCE LIMITS
# -----------------------------------------------------------------------------
# Cap memory usage to prevent System OOM-killer crashes or DoS
maxmemory 2gb

# Evict old keys when maxmemory is hit using volatile-lru
maxmemory-policy volatile-lru

# Note: Deprecated command renaming is omitted in favor of strict ACL rules.